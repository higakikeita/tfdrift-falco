global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'driftwire'
    static_configs:
      - targets: ['driftwire:9090']
        labels:
          service: 'driftwire'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
