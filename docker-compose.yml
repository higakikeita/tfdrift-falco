services:
  # ============================================
  # Falco - Runtime security monitoring
  # ============================================
  falco:
    image: falcosecurity/falco:0.43.0  # 0.37.1 was too old for the current CloudTrail plugin (Plugin API 3.11+); 0.43 loads it AND still ships grpc_output. Do NOT bump to 0.44+ (grpc_output removed). See #311.
    container_name: driftwire-falco
    platform: linux/amd64  # Force x86_64 for CloudTrail plugin compatibility
    privileged: true
    restart: unless-stopped
    ports:
      # Bound to localhost only: the API has no authentication and Falco gRPC
      # defaults to plaintext. Do NOT change to 0.0.0.0 / a public interface
      # without putting auth + TLS in front. See SECURITY.md.
      - "127.0.0.1:5060:5060"  # gRPC API (localhost only)
    volumes:
      # Docker socket for container monitoring
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro

      # driftwire Falco rules
      - ./rules/terraform_drift.yaml:/etc/falco/rules.d/terraform_drift.yaml:ro

      # Falco configuration (simplified for testing)
      - ./deployments/falco/falco-simple.yaml:/etc/falco/falco.yaml:ro

      # TLS certificates for gRPC
      - ./deployments/falco:/etc/falco/certs:ro

      # CloudTrail plugin library
      - ./deployments/falco/plugins:/etc/falco/plugins:ro

      # AWS credentials for CloudTrail plugin
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-mytf}
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - AWS_CONFIG_FILE=/root/.aws/config
    networks:
      - driftwire
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:5060"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # driftwire Backend - API Server
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: driftwire:latest
    container_name: driftwire-backend
    restart: unless-stopped
    # depends_on:
    #   falco:
    #     condition: service_healthy
    ports:
      # Bound to localhost only — the API has NO authentication. See SECURITY.md.
      - "127.0.0.1:8080:8080"  # API server (localhost only)
      - "127.0.0.1:9090:9090"  # metrics/debug (localhost only)
    volumes:
      # Configuration
      - ./config.yaml:/config/config.yaml:ro

      # AWS credentials
      - ${HOME}/.aws:/home/driftwire/.aws:ro

      # Terraform state (if using local backend)
      - ./terraform:/terraform:ro

      # Persistent data
      - driftwire-data:/data
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-mytf}
      - AWS_SHARED_CREDENTIALS_FILE=/home/driftwire/.aws/credentials
      - AWS_CONFIG_FILE=/home/driftwire/.aws/config
      - TZ=${TZ:-UTC}
      - DRIFTWIRE_FALCO_HOSTNAME=falco
      - DRIFTWIRE_FALCO_PORT=5060
      # Optional Slack webhook
      # - DRIFTWIRE_SLACK_WEBHOOK=${SLACK_WEBHOOK_URL}
    networks:
      - driftwire
    command: ["--server", "--api-port", "8080", "--config", "/config/config.yaml"]
    healthcheck:
      # GET, not --spider: --spider probes with HEAD, which the router
      # answers 405, leaving the service permanently "unhealthy".
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # driftwire Frontend - React UI
  # ============================================
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: driftwire-frontend:latest
    container_name: driftwire-frontend
    restart: unless-stopped
    ports:
      # Bound to localhost only. See SECURITY.md before exposing.
      - "127.0.0.1:3000:8080"  # Web UI (localhost only)
    environment:
      - VITE_API_BASE_URL=http://host.docker.internal:8080/api/v1
      - VITE_WS_URL=ws://host.docker.internal:8080/ws
      - VITE_SSE_URL=http://host.docker.internal:8080/api/v1/stream
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - driftwire
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  driftwire:
    driver: bridge
    name: driftwire-network

volumes:
  driftwire-data:
    driver: local
    name: driftwire-data

# ============================================
# Usage Examples
# ============================================
#
# 1. Start all services:
#    docker-compose up -d
#
# 2. View logs:
#    docker-compose logs -f backend
#    docker-compose logs -f frontend
#    docker-compose logs -f falco
#
# 3. Check status:
#    docker-compose ps
#
# 4. Stop services:
#    docker-compose down
#
# 5. Rebuild and restart:
#    docker-compose up -d --build
#
# 6. Scale services (if needed):
#    docker-compose up -d --scale backend=2
#
# 7. Access services:
#    Frontend: http://localhost:3000
#    Backend API: http://localhost:8080/api/v1
#    Backend Health: http://localhost:8080/health
#    Metrics: http://localhost:9090
#
# 8. Environment variables:
#    export AWS_REGION=us-west-2
#    export TERRAFORM_STATE_DIR=/path/to/terraform
#    docker-compose up -d
